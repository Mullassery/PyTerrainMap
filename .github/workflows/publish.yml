name: Publish to PyPI

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      pypi_env:
        description: 'PyPI environment'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi

jobs:
  build:
    name: Build wheels (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux wheels MUST be built via maturin-action's manylinux
          # container (not a bare `maturin build` on the runner's own
          # glibc) -- PyPI rejects a plain `linux_x86_64`/`linux_aarch64`
          # tagged wheel outright; only `manylinux_*` tags are accepted.
          # Previously this workflow ran `maturin build` directly on
          # ubuntu-latest, which would have produced exactly that
          # unpublishable tag -- it had also never actually been run (see
          # ROADMAP_HONEST.md), so this had never been caught.
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-latest
            target: aarch64
          - os: macos-latest
            target: x86_64
          - os: windows-latest
            target: x64

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Build wheels
      uses: PyO3/maturin-action@v1
      with:
        target: ${{ matrix.target }}
        args: --release --out dist
        manylinux: auto
        sccache: 'true'
      env:
        # ring's pregenerated ARMv8 assembly (pulled in transitively via
        # rustls/rcgen) requires __ARM_ARCH defined per ACLE (ring's
        # asm_base.h hard-errors "ARM assembler must define __ARM_ARCH"
        # otherwise). `-march=armv8-a` alone does NOT make this cross
        # compiler (manylinux2014-cross's aarch64-unknown-linux-gnu-gcc)
        # define it -- confirmed for real: the failing gcc invocation in CI
        # already included `-march=armv8-a` and still hit the same #error.
        # Defining the macro directly is what actually fixes it (found
        # running this workflow for real against aarch64 Linux).
        CFLAGS_aarch64_unknown_linux_gnu: -march=armv8-a -D__ARM_ARCH=8

    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}-${{ matrix.target }}
        path: dist/

  publish:
    name: Publish wheels to PyPI
    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        path: dist

    - name: Flatten artifacts
      run: find dist -name "*.whl" -exec mv {} dist/ \;

    - name: List wheels
      run: ls -la dist/

    - name: Publish to TestPyPI
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.pypi_env == 'testpypi'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        password: ${{ secrets.TEST_PYPI_API_TOKEN }}
        skip-existing: true

    - name: Publish to PyPI
      if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.pypi_env == 'pypi')
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}

    - name: Create GitHub Release
      if: github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: v${{ github.run_id }}
        name: Release v${{ github.run_id }}
        body: |
          Release artifacts:
          - PyPI: https://pypi.org/project/pyterrainMap/
          - TestPyPI: https://test.pypi.org/project/pyterrainMap/
        draft: false
        prerelease: false
