name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v7

    - uses: dtolnay/rust-toolchain@stable

    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # opencv-python is required by the ROS bridge RGB adapter tests
        # (tests/test_pyterrain_map_ros_bridge.py); numpy is required by
        # several test modules directly. Both come from the `imaging`/base
        # extras in pyproject.toml.
        pip install maturin pytest pytest-cov numpy opencv-python

    - name: Build with maturin
      # `maturin develop` requires an active virtualenv/conda env to install
      # into (it errors "Couldn't find a virtualenv..." otherwise) -- the
      # runner's system Python from actions/setup-python isn't one. Build +
      # pip install instead, which doesn't need that.
      run: |
        maturin build --release --out dist
        pip install dist/*.whl --force-reinstall

    - name: Run tests
      run: pytest tests/ --cov=pyterrain_map --cov-report=xml

    - name: Upload coverage
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff black mypy pip-audit

    - name: Run ruff
      run: ruff check python/

    - name: Run black
      run: black --check python/

    - name: Run mypy
      run: mypy python/pyterrain_map --ignore-missing-imports || true

    - name: Run pip-audit (Python dependency vulnerability scan)
      # Advisory only for now: not gating CI on this in the same pass that
      # added it, since no historical baseline exists yet for this repo.
      # Requires network access to PyPI's advisory feed -- unverified in any
      # network-restricted sandbox; runs for real on GitHub-hosted runners.
      continue-on-error: true
      run: pip-audit

  cargo-check:
    name: Cargo Check and Clippy
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: dtolnay/rust-toolchain@stable

    - name: Run cargo check
      run: cargo check --release

    - name: Run cargo test
      # `extension-module` is a default feature, so a plain `cargo test` links
      # against Python symbols that only maturin provides. Disable defaults and
      # point PYO3 at a Python >= 3.10 so the standalone test binary links.
      env:
        PYO3_PYTHON: python3.11
      run: cargo test --workspace --release --no-default-features --features database

    - name: Run cargo clippy
      run: cargo clippy --release -- -D warnings

    - name: Run cargo audit
      run: |
        cargo install cargo-audit
        cargo audit

  build-wheels:
    name: Build wheel (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            label: linux-x86_64
          - os: ubuntu-latest
            target: aarch64
            label: linux-aarch64
          - os: windows-latest
            target: x64
            label: windows-x86_64

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: Build manylinux / Windows wheel
      uses: PyO3/maturin-action@v1
      with:
        target: ${{ matrix.target }}
        manylinux: auto
        args: --release --out dist
      env:
        # ring's pregenerated ARMv8 assembly requires __ARM_ARCH on the
        # aarch64 manylinux cross toolchain; harmless on x86_64/Windows.
        CFLAGS_aarch64_unknown_linux_gnu: -march=armv8-a -D__ARM_ARCH=8

    - name: Smoke-test wheel
      if: matrix.label != 'linux-aarch64'
      shell: bash
      run: |
        python -m pip install --force-reinstall dist/*.whl
        python -c "import pyterrain_map; print(pyterrain_map.__version__)"

    - name: Upload wheels
      uses: actions/upload-artifact@v7
      with:
        name: wheels-${{ matrix.label }}
        path: dist/*.whl
        if-no-files-found: error
