name: Bug report
description: Report something that is broken in PyTerrainMap
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please check the README's
        Features table and `docs/KNOWN_ISSUES.md` first -- several limitations
        (e.g. terrain intelligence being demo/fixed output, no persistent DB
        backend, several failing Rust unit tests) are already known and
        documented there.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including the exact error message or output.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal code/commands that reproduce the issue.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: PyTerrainMap version
      description: Output of `python -c "import pyterrain_map; print(pyterrain_map.__version__)"`
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS ARM64 (Apple Silicon)
        - macOS Intel
        - Linux x86_64
        - Windows
        - Other (describe below)
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - pip install pyterrainMap (wheel)
        - Built from source (maturin develop)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / traceback
      render: shell
