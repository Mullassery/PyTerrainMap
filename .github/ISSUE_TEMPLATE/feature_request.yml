name: Feature request
description: Suggest an idea or improvement for PyTerrainMap
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, check `docs/VISION.md` and the README's Features table --
        several things that look missing (real terrain/elevation analysis,
        persistent SQL backends, real photogrammetry) are already known gaps,
        not surprises.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that PyTerrainMap doesn't support today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see implemented?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other approaches you've tried.
    validations:
      required: false
